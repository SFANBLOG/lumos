services:
  mysql:
    image: mysql:8.0
    container_name: lumos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lumos}
      MYSQL_USER: ${MYSQL_USER:-lumos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lumos}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lumos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内保持 8000, 宿主机通过 ports 8001:8000 访问
      APP_PORT: 8000
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-lumos}:${MYSQL_PASSWORD:-lumos}@mysql:3306/${MYSQL_DATABASE:-lumos}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 使用宿主机持久化好的本地 embedding 模型 (只读), 避免容器内重复下载
      EMBEDDING_MODEL_NAME: /models/bge-base-zh-v1.5
      # hf-mirror 不代理 Xet CAS 服务, 不禁用会 401 导致下载失败
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # 本地 embedding 模型 (宿主机持久化, 只读挂载; 无需容器内重新下载)
      - ./backend/models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: lumos-front
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
