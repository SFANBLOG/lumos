# ========================================
# PocketBay / Render / Fly 单容器 nginx 配置
# ========================================
# 与 front/nginx.conf 的差异:
#   - 监听 ${PORT} (PocketBay 注入, 默认 8080)
#   - /api 反代目标改为 127.0.0.1:8000 (容器内 uvicorn)
#   - 不再依赖 docker-compose 的 backend host

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩 (Vue 静态包较大)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端 SPA 路由 (Vue Router history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代 → uvicorn (容器内 127.0.0.1:8000)
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流 (合同分析/智能咨询) 必须关闭缓冲并放宽读超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 直接 API 文档 (FastAPI Swagger)
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 健康检查 (PocketBay / Docker HEALTHCHECK 同时可达)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}