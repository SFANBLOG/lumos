; ========================================
; PocketBay 单容器进程管理 (nginx + uvicorn)
; ========================================
; nginx 监听 ${PORT} (PocketBay 注入, 默认 8080)
; uvicorn 监听 127.0.0.1:8000 (容器内)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:uvicorn]
; 单 worker: 分析任务的事件缓冲在进程内存中, 多 worker 会导致订阅分到另一进程
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
user=lumos
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:lumos]
programs=uvicorn,nginx